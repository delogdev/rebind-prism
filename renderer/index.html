<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'" />
    <title>Rebind Prism</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- ================================================================ bar -->
    <header class="bar" id="bar">
      <div class="bar-drag"></div>

      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 28 28" width="24" height="24">
          <!-- One beam in, a spectrum out. The mark is the product: a
               recording goes in, a set of tests comes out. -->
          <defs>
            <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="var(--cyan)" />
              <stop offset="0.5" stop-color="var(--indigo)" />
              <stop offset="1" stop-color="var(--magenta)" />
            </linearGradient>
          </defs>
          <path d="M14 5 L23 20 H5 Z" fill="none" stroke="url(#spectrum)" stroke-width="1.9" stroke-linejoin="round" />
          <path d="M1 14 H10" stroke="var(--ink-3)" stroke-width="1.5" stroke-linecap="round" />
          <path d="M17.5 15.5 H27" stroke="var(--cyan)" stroke-width="1.3" stroke-linecap="round" />
          <path d="M18.5 18 H27" stroke="var(--indigo)" stroke-width="1.3" stroke-linecap="round" />
          <path d="M19.5 20.5 H27" stroke="var(--magenta)" stroke-width="1.3" stroke-linecap="round" />
        </svg>
      </span>

      <div class="bar-id">
        <b>Prism</b>
        <nav class="crumbs" id="crumbs" aria-label="Location"></nav>
      </div>

      <button class="finder" id="finder" type="button">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><path d="m21 21-4.3-4.3" /></svg>
        <span>Find a request or run a command</span>
        <kbd><i>Ctrl</i><i>K</i></kbd>
      </button>

      <div class="bar-right">
        <button class="env-pick" id="envPick" type="button">
          <span class="env-dot" id="envDot"></span>
          <span id="envLabel">No environment</span>
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="m6 9 6 6 6-6" /></svg>
        </button>

        <button class="pill" id="importBtn" type="button" title="Import a Rebind or Postman collection">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v11" /><path d="m7.5 9.5 4.5 4.5 4.5-4.5" /><path d="M4 20h16" /></svg>
          Import
        </button>
        <button class="pill" id="exportBtn" type="button" title="Export code or a collection">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14V3" /><path d="m7.5 7.5 4.5-4.5 4.5 4.5" /><path d="M4 20h16" /></svg>
          Export
        </button>
        <button class="pill go" id="runFlowBtn" type="button">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" stroke="none"><path d="M7 4v16l13-8z" /></svg>
          Run flow
        </button>

        <button class="icobtn" id="themeBtn" type="button" title="Theme" aria-label="Switch theme">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.2" />
            <path class="rays" d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4" />
            <path class="moon" d="M15.5 12a5 5 0 0 1-6.4-4.8A5.4 5.4 0 1 0 15.5 12z" fill="currentColor" stroke="none" />
          </svg>
        </button>
        <button class="icobtn" id="settingsBtn" type="button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.3a2 2 0 1 1-4 0v-.2a1.6 1.6 0 0 0-2.8-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3.5 15H3a2 2 0 1 1 0-4h.2a1.6 1.6 0 0 0 1.1-2.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 10 4.5V4a2 2 0 1 1 4 0v.2a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.3a2 2 0 1 1 0 4h-.2a1.6 1.6 0 0 0-1.3 1z" />
          </svg>
        </button>

        <div class="winbtns">
          <button id="winMin" type="button" aria-label="Minimise"><i class="w-min"></i></button>
          <button id="winMax" type="button" aria-label="Maximise"><i class="w-max"></i></button>
          <button id="winClose" type="button" aria-label="Close" class="x"><i class="w-x"></i></button>
        </div>
      </div>
    </header>

    <main class="stage">
      <!-- ============================================================ tree -->
      <nav class="tree" aria-label="Collections">
        <div class="tree-top">
          <span class="tree-title">Collections</span>
          <button class="mini-btn" id="newCollectionBtn" type="button" title="New collection" aria-label="New collection">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
          </button>
        </div>
        <div class="tree-body" id="treeBody"></div>
        <div class="tree-bottom">
          <button class="tree-act" id="envBtn" type="button">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5c0 1.1.9 2 2 2h1" /><path d="M16 21h1a2 2 0 0 0 2-2v-5c0-1.1.9-2 2-2a2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1" /></svg>
            Environments
          </button>
          <button class="tree-act" id="historyBtn" type="button">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></svg>
            History
          </button>
        </div>
      </nav>

      <!-- ========================================================== canvas -->
      <section class="plane" id="plane">
        <div class="plane-dots" id="planeDots"></div>
        <svg class="beams" id="beams" aria-hidden="true"></svg>
        <div class="nodes" id="nodes"></div>

        <div class="plane-tools">
          <div class="zoomer">
            <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
            <span id="zoomPct">100%</span>
            <button id="zoomIn" type="button" aria-label="Zoom in">+</button>
            <span class="zdiv"></span>
            <button id="zoomFit" type="button">Fit</button>
            <button id="tidyBtn" type="button" title="Lay the nodes back out in order">Tidy</button>
          </div>
        </div>

        <div class="legend">
          <span><i class="lg needs"></i>needs</span>
          <span><i class="lg gives"></i>gives</span>
          <span><i class="lg beam"></i>value travels</span>
        </div>

        <div class="intake" id="intake" hidden>
          <div class="intake-top">
            <span class="rec-dot"></span>
            <b id="intakeCount">0 recorded</b>
            <button class="ghosty" id="intakeHide" type="button">Hide</button>
          </div>
          <div class="intake-rows" id="intakeRows"></div>
          <button class="intake-all" id="intakeAll" type="button">Turn all into tests</button>
        </div>

        <div class="plane-empty" id="planeEmpty" hidden>
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M12 3 21 19H3Z" /></svg>
          <h3>Nothing on the plane</h3>
          <p>Import a Rebind recording or a Postman collection, or start from a blank request.</p>
          <div class="plane-empty-acts">
            <button class="pill go" id="emptyImport" type="button">Import a collection</button>
            <button class="pill" id="emptyNew" type="button">Blank request</button>
          </div>
        </div>
      </section>

      <!-- ======================================================= workbench -->
      <aside class="bench" aria-label="Workbench">
        <div class="bench-none" id="benchNone">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 12h4l3-7 4 14 3-7h4" /></svg>
          <p>Pick a node to work on it.</p>
        </div>

        <div class="bench-live" id="benchLive" hidden>
          <div class="bench-head">
            <span class="verb" id="benchVerb">GET</span>
            <input class="bench-name" id="benchName" aria-label="Request name" />
            <button class="mini-btn danger" id="benchDelete" type="button" title="Delete this request" aria-label="Delete this request">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13" /></svg>
            </button>
          </div>

          <div class="addr">
            <div class="addr-verb" id="addrVerb">
              <span id="addrVerbText">GET</span>
              <select id="methodPick" aria-label="Method"></select>
            </div>
            <input class="addr-url" id="urlInput" spellcheck="false" placeholder="{{base_url}}/api/…" aria-label="Endpoint" />
            <button class="addr-go" id="sendBtn" type="button">
              <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" stroke="none"><path d="M7 4v16l13-8z" /></svg>
              <span id="sendLabel">Send</span>
            </button>
          </div>

          <p class="wire-preview" id="wirePreview"></p>

          <div class="bench-split" id="benchSplit">
            <div class="bench-pane">
              <div class="tabs" id="editTabs" role="tablist"></div>
              <div class="tabbody" id="editBody"></div>
            </div>
            <div class="bench-grip" id="benchGrip" role="separator" aria-orientation="horizontal" aria-label="Resize" tabindex="0"><span></span></div>
            <div class="bench-pane">
              <div class="tabs" id="respTabs" role="tablist"></div>
              <div class="tabbody" id="respBody"></div>
            </div>
          </div>
        </div>
      </aside>
    </main>

    <div class="veil" id="veil" hidden></div>
    <div class="notes" id="notes" aria-live="polite"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
